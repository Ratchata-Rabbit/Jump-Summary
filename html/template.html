<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #667085; --line: #e4e7ec;
    --brand: #1a73e8; --brand-soft: #e8f0fe;
    --ok: #188038; --ok-soft: #e6f4ea; --warn: #b3261e; --warn-soft: #fce8e6;
    --code-bg: #f2f4f7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218; --card: #171b23; --text: #e6e8ec; --muted: #9aa3b2; --line: #2a303b;
      --brand: #8ab4f8; --brand-soft: #1e2a3d; --ok: #81c995; --ok-soft: #16301f;
      --warn: #f28b82; --warn-soft: #3b1d1b; --code-bg: #10141b;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.7 'Sarabun', system-ui, sans-serif; }
  .layout { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px;
            display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; }
  nav.toc { position: sticky; top: 24px; align-self: start; font-size: 14px; }
  nav.toc b { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  nav.toc a { display: block; padding: 4px 10px; border-left: 2px solid var(--line); color: var(--muted); text-decoration: none; }
  nav.toc a:hover, nav.toc a.active { color: var(--brand); border-color: var(--brand); }
  main { min-width: 0; }
  header { margin-bottom: 24px; }
  h1 { font-size: 28px; line-height: 1.3; margin: 0 0 4px; }
  .meta { color: var(--muted); margin: 0; font-size: 14px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 24px; margin-bottom: 16px; }
  h2 { font-size: 20px; margin: 0 0 12px; scroll-margin-top: 16px; }
  h3 { font-size: 16px; margin: 18px 0 8px; }
  p { margin: 8px 0; }
  a { color: var(--brand); word-break: break-word; }
  ul, ol { padding-left: 22px; margin: 8px 0; }
  li { margin: 3px 0; }
  ul.tasks { list-style: none; padding-left: 0; }
  li.task { padding-left: 28px; position: relative; }
  li.task::before { content: ""; position: absolute; left: 0; top: 5px; width: 16px; height: 16px;
                    border: 2px solid var(--muted); border-radius: 4px; }
  li.task.done { color: var(--muted); }
  li.task.done::before { background: var(--ok); border-color: var(--ok); }
  li.task.done::after { content: "✓"; position: absolute; left: 3px; top: 1px; color: #fff; font-size: 13px; font-weight: 700; }
  .table-wrap { overflow-x: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: var(--brand-soft); font-weight: 600; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  code { font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; font-size: .88em;
         background: var(--code-bg); padding: 1px 6px; border-radius: 5px; }
  pre { position: relative; background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px;
        padding: 14px 16px; overflow-x: auto; margin: 10px 0; }
  pre code { background: none; padding: 0; font-size: 13px; line-height: 1.6; }
  .copy { position: absolute; top: 8px; right: 8px; font: 600 12px 'Sarabun', sans-serif; padding: 3px 10px;
          border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--muted); cursor: pointer; }
  .copy:hover { color: var(--brand); border-color: var(--brand); }
  .callout { border-radius: 10px; padding: 10px 14px; margin: 10px 0; }
  .callout.warn { background: var(--warn-soft); border-left: 4px solid var(--warn); }
  .callout.ok { background: var(--ok-soft); border-left: 4px solid var(--ok); }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; padding-top: 20px; }
    nav.toc { display: none; }
    section { padding: 16px; }
  }
  @media print {
    body { background: #fff; }
    nav.toc, .copy { display: none !important; }
    .layout { display: block; padding: 0; }
    section { break-inside: avoid; border: 0; padding: 0 0 12px; }
    a { color: inherit; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav class="toc" id="toc"><b>สารบัญ</b></nav>
  <main>
    <header>
      <h1>{{TITLE}}</h1>
      <p class="meta">{{META เช่น อัปเดต 14 ต.ค. 2026}}</p>
    </header>

    <!-- แต่ละหัวข้อ ## = 1 section -->
    <section>
      <h2 id="s1">{{หัวข้อ}}</h2>
      <p>{{เนื้อหา}}</p>
    </section>
  </main>
</div>
<script>
  // สารบัญอัตโนมัติจาก h2
  const toc = document.getElementById('toc');
  document.querySelectorAll('main h2').forEach((h, i) => {
    if (!h.id) h.id = 's' + (i + 1);
    const a = document.createElement('a');
    a.href = '#' + h.id; a.textContent = h.textContent;
    toc.appendChild(a);
  });
  const links = [...toc.querySelectorAll('a')];
  const spy = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) links.forEach(a => a.classList.toggle('active', a.hash === '#' + e.target.id));
  }), { rootMargin: '0px 0px -70% 0px' });
  document.querySelectorAll('main h2').forEach(h => spy.observe(h));

  // ปุ่ม Copy ให้ทุก code block
  document.querySelectorAll('pre').forEach(pre => {
    const b = document.createElement('button');
    b.className = 'copy'; b.textContent = 'Copy';
    b.onclick = async () => {
      try { await navigator.clipboard.writeText(pre.querySelector('code')?.innerText ?? pre.innerText); b.textContent = 'Copied ✓'; }
      catch { b.textContent = 'Copy ไม่ได้'; }
      setTimeout(() => (b.textContent = 'Copy'), 1500);
    };
    pre.appendChild(b);
  });
</script>
</body>
</html>
